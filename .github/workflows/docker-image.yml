name: Reveal Web test, build and deploy

on:
  push:
    branches: [ main, zambia-aggregation, zam-agg, nih-simulation, nih-2024, nih-2024-enhance, mali-extract, test_mali_2, feature/add-plan-to-simulation ]

jobs:

  npm-install-and-build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout reveal-web
        uses: actions/checkout@v3
        with:
          repository: akrosinc/reveal-web

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install dependencies
        run: npm install

      - name: Build the app
        run: CI=false npm run build

  build-and-push-docker-image:

    runs-on: ubuntu-latest
    needs: [npm-install-and-build]

    steps:
      - name: Output Run Number
        run: echo ${{ github.run_number }}

      - name: Checkout reveal-web
        uses: actions/checkout@v3
        with:
          repository: akrosinc/reveal-web

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: akrosinc
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: akrosinc/reveal-web:v3.0.${{ github.run_number }}
