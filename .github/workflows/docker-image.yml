name: Reveal Web test, build and deploy

on:
  push:
    branches: [ main, zambia-aggregation, zam-agg, nih-simulation, nih-2024, feature/sidebar-component-build, testbuild ]

jobs:

  yarn-install-and-build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout reveal-web
      uses: actions/checkout@v3
      with:
        repository: akrosinc/reveal-web


    - uses: borales/actions-yarn@v5.0.0
      with:
        cmd: install # will run `yarn install` command


    - uses: borales/actions-yarn@v5.0.0
      with:
        cmd: upgrade # will run `yarn upgrade` command

    - uses: borales/actions-yarn@v5.0.0
      with:
        cmd: list # will run `yarn upgrade` command

    - uses: borales/actions-yarn@v5.0.0
      with:
        cmd: build --verbose # will run `yarn build` command
      env:
        NODE_OPTIONS: --openssl-legacy-provider
        CI: false


  build-and-push-docker-image:

    runs-on: ubuntu-latest
    needs: [yarn-install-and-build]

    steps:

    - name: Output Run Number
      run: echo ${{ github.run_number }}

    - name: Checkout reveal-web
      uses: actions/checkout@v3
      with:
        repository: akrosinc/reveal-web

    - name: Login to DockerHub
      uses: docker/login-action@v1
      with:
        username: akrosinc
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v2
      with:
        context: .
        push: true
        tags: akrosinc/reveal-web:v3.0.${{ github.run_number }}
